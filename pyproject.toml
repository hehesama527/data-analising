[build-system]
requires = ["setuptools>=68", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trajmetrics"
version = "0.5.3"
description = "Lightweight metrics helpers for trajectory analysis pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TrajMetrics Contributors" }]
keywords = ["metrics", "analytics", "trajectory", "dataset", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hehesama527/data-analising"
Repository = "https://github.com/hehesama527/data-analising"
Issues = "https://github.com/hehesama527/data-analising/issues"

[project.scripts]
trajmetrics = "trajmetrics:run"

[tool.setuptools]
packages = ["trajmetrics"]

[tool.setuptools.package-dir]
trajmetrics = "src/trajmetrics"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *-manylinux_i686 *-win32"
test-command = "python -c \"import trajmetrics; print(trajmetrics.__version__)\""
